<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has('nojs')) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var covers = Array.prototype.slice.call(document.querySelectorAll('.cover--reels-pipeline'));
  function run() {
    covers.forEach(function (el) {
      var tl = window.SiteCovers['reels-pipeline'](el, window.gsap);
      if (q.has('t')) tl.pause().seek(parseFloat(q.get('t')), false);
    });
  }
  document.querySelector('.replay').addEventListener('click', run);
  if (reduce && !q.has('t')) return;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(run);
})();
</script>
